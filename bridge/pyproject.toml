[project]
name = "giaoit-bridge"
version = "0.1.0"
description = "GiaoIT V1 bridge — watches ~/.giaoit/captures/pending and forwards to receiver."
requires-python = ">=3.14"
dependencies = [
  "httpx",
  "watchdog",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]
