[project]
name = "giaoit-receiver"
version = "0.1.0"
description = "GiaoIT V1 receiver stub — idempotent endpoint for capture payloads."
requires-python = ">=3.14"
dependencies = [
  "fastapi",
  "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["receiver"]
